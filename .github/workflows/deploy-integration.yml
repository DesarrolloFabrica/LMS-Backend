name: integration

on:
  push:
    branches: [integration]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump for this deployment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: integration-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_BACKEND_SERVICE }}
  CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL }}
  DB_NAME: ${{ vars.DB_NAME }}
  DB_USER: ${{ vars.DB_USER }}
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  GOOGLE_ALLOWED_DOMAIN: ${{ vars.GOOGLE_ALLOWED_DOMAIN }}
  GOOGLE_DRIVE_OPERATOR_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_OPERATOR_CLIENT_ID }}
  GOOGLE_DRIVE_DESTINATION_ROOT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_DESTINATION_ROOT_FOLDER_ID }}
  LMS_NOTIFICATION_EMAIL: ${{ vars.LMS_NOTIFICATION_EMAIL }}
  SMTP_HOST: ${{ vars.SMTP_HOST }}
  SMTP_FROM: ${{ vars.SMTP_FROM }}
  IMAGE_NAME: backend/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GitHub configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DB_PASSWORD_SECRET_NAME: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
          JWT_SECRET_SECRET_NAME: ${{ secrets.JWT_SECRET_SECRET_NAME }}
          SMTP_USER_SECRET_NAME: ${{ secrets.SMTP_USER_SECRET_NAME }}
          SMTP_PASS_SECRET_NAME: ${{ secrets.SMTP_PASS_SECRET_NAME }}
          GOOGLE_DRIVE_OPERATOR_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_OPERATOR_CLIENT_SECRET }}
          GOOGLE_DRIVE_OPERATOR_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_OPERATOR_REFRESH_TOKEN }}
        run: |
          required_vars=(
            PROJECT_ID
            REGION
            ARTIFACT_REPOSITORY
            SERVICE_NAME
            CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT
            CLOUD_SQL_INSTANCE
            GCP_SA_KEY
            DB_PASSWORD_SECRET_NAME
            JWT_SECRET_SECRET_NAME
            SMTP_USER_SECRET_NAME
            SMTP_PASS_SECRET_NAME
            GOOGLE_DRIVE_OPERATOR_CLIENT_ID
            GOOGLE_DRIVE_DESTINATION_ROOT_FOLDER_ID
            GOOGLE_DRIVE_OPERATOR_CLIENT_SECRET
            GOOGLE_DRIVE_OPERATOR_REFRESH_TOKEN
          )

          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub variable or secret: ${name}"
              exit 1
            fi
          done

      - name: Normalize deployment variables
        run: |
          trim_value() {
            printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          {
            echo "PROJECT_ID=$(trim_value "${PROJECT_ID}")"
            echo "REGION=$(trim_value "${REGION}")"
            echo "ARTIFACT_REPOSITORY=$(trim_value "${ARTIFACT_REPOSITORY}")"
            echo "SERVICE_NAME=$(trim_value "${SERVICE_NAME}")"
            echo "CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT=$(trim_value "${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}")"
            echo "CLOUD_SQL_INSTANCE=$(trim_value "${CLOUD_SQL_INSTANCE}")"
            echo "FRONTEND_URL=$(trim_value "${FRONTEND_URL}")"
            echo "DB_NAME=$(trim_value "${DB_NAME}")"
            echo "DB_USER=$(trim_value "${DB_USER}")"
            echo "GOOGLE_CLIENT_ID=$(trim_value "${GOOGLE_CLIENT_ID}")"
            echo "GOOGLE_ALLOWED_DOMAIN=$(trim_value "${GOOGLE_ALLOWED_DOMAIN}")"
            echo "GOOGLE_DRIVE_OPERATOR_CLIENT_ID=$(trim_value "${GOOGLE_DRIVE_OPERATOR_CLIENT_ID}")"
            echo "GOOGLE_DRIVE_DESTINATION_ROOT_FOLDER_ID=$(trim_value "${GOOGLE_DRIVE_DESTINATION_ROOT_FOLDER_ID}")"
            echo "LMS_NOTIFICATION_EMAIL=$(trim_value "${LMS_NOTIFICATION_EMAIL}")"
            echo "SMTP_HOST=$(trim_value "${SMTP_HOST}")"
            echo "SMTP_FROM=$(trim_value "${SMTP_FROM}")"
          } >> "$GITHUB_ENV"

      - name: Resolve API version
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail

          bump="${MANUAL_BUMP:-}"

          if [ -z "${bump}" ]; then
            labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq '.[0].labels[].name' 2>/dev/null || true)"

            if printf '%s\n' "${labels}" | grep -Eiq '(^|:|/|-)major$|^major$'; then
              bump="major"
            elif printf '%s\n' "${labels}" | grep -Eiq '(^|:|/|-)minor$|^minor$'; then
              bump="minor"
            elif printf '%s\n' "${labels}" | grep -Eiq '(^|:|/|-)patch$|^patch$'; then
              bump="patch"
            else
              bump="patch"
            fi
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "${latest_tag}" ]; then
            next_version="1.0.0"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${version}"

            case "${bump}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "::error::Invalid version bump: ${bump}"
                exit 1
                ;;
            esac

            next_version="${major}.${minor}.${patch}"
          fi

          {
            echo "VERSION_BUMP=${bump}"
            echo "API_VERSION=${next_version}"
            echo "API_VERSION_TAG=v${next_version}"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Install database migration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        env:
          DB_PASSWORD_SECRET_NAME: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
        run: |
          set -euo pipefail

          curl -fsSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.18.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 "${CLOUD_SQL_INSTANCE}" > cloud-sql-proxy.log 2>&1 &
          proxy_pid=$!
          trap 'kill "${proxy_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U "${DB_USER}" >/dev/null 2>&1; then
              break
            fi

            if ! kill -0 "${proxy_pid}" 2>/dev/null; then
              cat cloud-sql-proxy.log
              echo "::error::Cloud SQL proxy stopped unexpectedly"
              exit 1
            fi

            sleep 2
          done

          if ! pg_isready -h 127.0.0.1 -p 5432 -U "${DB_USER}" >/dev/null 2>&1; then
            cat cloud-sql-proxy.log
            echo "::error::Cloud SQL proxy did not become ready"
            exit 1
          fi

          export PGPASSWORD="$(gcloud secrets versions access latest --secret="${DB_PASSWORD_SECRET_NAME}")"

          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql \
              -h 127.0.0.1 \
              -p 5432 \
              -U "${DB_USER}" \
              -d "${DB_NAME}" \
              -v ON_ERROR_STOP=1 \
              -f "${migration}"
          done

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE_BASE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_URI_LATEST="${IMAGE_BASE_URI}:latest"
          IMAGE_URI_VERSION="${IMAGE_BASE_URI}:${API_VERSION_TAG}"

          docker build \
            -t "${IMAGE_URI_LATEST}" \
            -t "${IMAGE_URI_VERSION}" \
            .

          {
            echo "IMAGE_URI=${IMAGE_URI_VERSION}"
            echo "IMAGE_URI_LATEST=${IMAGE_URI_LATEST}"
            echo "IMAGE_URI_VERSION=${IMAGE_URI_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Push image
        run: |
          docker push "${IMAGE_URI_LATEST}"
          docker push "${IMAGE_URI_VERSION}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          region: ${{ env.REGION }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=${{ env.CLOUD_SQL_INSTANCE }}
            --timeout=3600
          env_vars_update_strategy: overwrite
          secrets_update_strategy: overwrite
          env_vars: |
            NODE_ENV=production
            CORS_ORIGIN=${{ env.FRONTEND_URL }}
            APP_BASE_URL=${{ env.FRONTEND_URL }}
            DB_HOST=/cloudsql/${{ env.CLOUD_SQL_INSTANCE }}
            DB_PORT=5432
            DB_NAME=${{ env.DB_NAME }}
            DB_USER=${{ env.DB_USER }}
            DB_SSL=false
            DB_LOGGING=false
            DB_SYNC=false
            JWT_EXPIRES_IN=4h
            SESSION_COOKIE_NAME=carga_lms_session
            SESSION_COOKIE_SECURE=true
            SESSION_COOKIE_SAME_SITE=none
            GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
            GOOGLE_ALLOWED_DOMAIN=${{ env.GOOGLE_ALLOWED_DOMAIN }}
            GOOGLE_DRIVE_OPERATOR_CLIENT_ID=${{ env.GOOGLE_DRIVE_OPERATOR_CLIENT_ID }}
            GOOGLE_DRIVE_DESTINATION_ROOT_FOLDER_ID=${{ env.GOOGLE_DRIVE_DESTINATION_ROOT_FOLDER_ID }}
            LMS_NOTIFICATION_EMAIL=${{ env.LMS_NOTIFICATION_EMAIL }}
            SMTP_HOST=${{ env.SMTP_HOST }}
            SMTP_PORT=587
            SMTP_SECURE=false
            SMTP_FROM=${{ env.SMTP_FROM }}
          secrets: |
            DB_PASSWORD=${{ secrets.DB_PASSWORD_SECRET_NAME }}:latest
            JWT_SECRET=${{ secrets.JWT_SECRET_SECRET_NAME }}:latest
            SMTP_USER=${{ secrets.SMTP_USER_SECRET_NAME }}:latest
            SMTP_PASS=${{ secrets.SMTP_PASS_SECRET_NAME }}:latest
            GOOGLE_DRIVE_OPERATOR_CLIENT_SECRET=${{ secrets.GOOGLE_DRIVE_OPERATOR_CLIENT_SECRET }}:latest
            GOOGLE_DRIVE_OPERATOR_REFRESH_TOKEN=${{ secrets.GOOGLE_DRIVE_OPERATOR_REFRESH_TOKEN }}:latest

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format "value(status.url)"

      - name: Create GitHub version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${API_VERSION_TAG}" -m "integration ${API_VERSION_TAG} (${VERSION_BUMP})"
          git push origin "${API_VERSION_TAG}"

      - name: Show Cloud Run logs on failure
        if: failure()
        run: |
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --limit 50 \
            --format "value(timestamp,severity,textPayload)"
