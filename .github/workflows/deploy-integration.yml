name: Deploy backend integration

on:
  push:
    branches: [integration]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_BACKEND_SERVICE }}
  IMAGE_NAME: backend/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -t "${IMAGE_URI}" .
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Push image
        run: docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          region: ${{ env.REGION }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=${{ vars.CLOUD_SQL_INSTANCE }}
          env_vars: |
            NODE_ENV=production
            PORT=8080
            CORS_ORIGIN=${{ vars.FRONTEND_URL }}
            APP_BASE_URL=${{ vars.FRONTEND_URL }}
            DB_HOST=/cloudsql/${{ vars.CLOUD_SQL_INSTANCE }}
            DB_PORT=5432
            DB_NAME=${{ vars.DB_NAME }}
            DB_USER=${{ vars.DB_USER }}
            DB_SSL=false
            DB_LOGGING=false
            DB_SYNC=false
            JWT_EXPIRES_IN=4h
            SESSION_COOKIE_NAME=carga_lms_session
            SESSION_COOKIE_SECURE=true
            SESSION_COOKIE_SAME_SITE=none
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            GOOGLE_ALLOWED_DOMAIN=${{ vars.GOOGLE_ALLOWED_DOMAIN }}
            LMS_NOTIFICATION_EMAIL=${{ vars.LMS_NOTIFICATION_EMAIL }}
            SMTP_HOST=${{ vars.SMTP_HOST }}
            SMTP_PORT=587
            SMTP_SECURE=false
            SMTP_FROM=${{ vars.SMTP_FROM }}
          secrets: |
            DB_PASSWORD=${{ secrets.DB_PASSWORD_SECRET_NAME }}:latest
            JWT_SECRET=${{ secrets.JWT_SECRET_SECRET_NAME }}:latest
            SMTP_USER=${{ secrets.SMTP_USER_SECRET_NAME }}:latest
            SMTP_PASS=${{ secrets.SMTP_PASS_SECRET_NAME }}:latest

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format "value(status.url)"
