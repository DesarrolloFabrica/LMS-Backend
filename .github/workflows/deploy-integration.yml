name: integration

on:
  push:
    branches: [integration]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_BACKEND_SERVICE }}
  CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL }}
  DB_NAME: ${{ vars.DB_NAME }}
  DB_USER: ${{ vars.DB_USER }}
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
  GOOGLE_ALLOWED_DOMAIN: ${{ vars.GOOGLE_ALLOWED_DOMAIN }}
  LMS_NOTIFICATION_EMAIL: ${{ vars.LMS_NOTIFICATION_EMAIL }}
  SMTP_HOST: ${{ vars.SMTP_HOST }}
  SMTP_FROM: ${{ vars.SMTP_FROM }}
  IMAGE_NAME: backend/api
  IMAGE_ENVIRONMENT: integration
  IMAGE_VERSION: 1.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DB_PASSWORD_SECRET_NAME: ${{ secrets.DB_PASSWORD_SECRET_NAME }}
          JWT_SECRET_SECRET_NAME: ${{ secrets.JWT_SECRET_SECRET_NAME }}
          SMTP_USER_SECRET_NAME: ${{ secrets.SMTP_USER_SECRET_NAME }}
          SMTP_PASS_SECRET_NAME: ${{ secrets.SMTP_PASS_SECRET_NAME }}
        run: |
          required_vars=(
            PROJECT_ID
            REGION
            ARTIFACT_REPOSITORY
            SERVICE_NAME
            CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT
            CLOUD_SQL_INSTANCE
            GCP_SA_KEY
            DB_PASSWORD_SECRET_NAME
            JWT_SECRET_SECRET_NAME
            SMTP_USER_SECRET_NAME
            SMTP_PASS_SECRET_NAME
          )

          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub variable or secret: ${name}"
              exit 1
            fi
          done

      - name: Normalize deployment variables
        run: |
          trim_value() {
            printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          {
            echo "PROJECT_ID=$(trim_value "${PROJECT_ID}")"
            echo "REGION=$(trim_value "${REGION}")"
            echo "ARTIFACT_REPOSITORY=$(trim_value "${ARTIFACT_REPOSITORY}")"
            echo "SERVICE_NAME=$(trim_value "${SERVICE_NAME}")"
            echo "CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT=$(trim_value "${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}")"
            echo "CLOUD_SQL_INSTANCE=$(trim_value "${CLOUD_SQL_INSTANCE}")"
            echo "FRONTEND_URL=$(trim_value "${FRONTEND_URL}")"
            echo "DB_NAME=$(trim_value "${DB_NAME}")"
            echo "DB_USER=$(trim_value "${DB_USER}")"
            echo "GOOGLE_CLIENT_ID=$(trim_value "${GOOGLE_CLIENT_ID}")"
            echo "GOOGLE_ALLOWED_DOMAIN=$(trim_value "${GOOGLE_ALLOWED_DOMAIN}")"
            echo "LMS_NOTIFICATION_EMAIL=$(trim_value "${LMS_NOTIFICATION_EMAIL}")"
            echo "SMTP_HOST=$(trim_value "${SMTP_HOST}")"
            echo "SMTP_FROM=$(trim_value "${SMTP_FROM}")"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE_BASE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_URI_ENVIRONMENT="${IMAGE_BASE_URI}:${IMAGE_ENVIRONMENT}"
          IMAGE_URI_VERSION="${IMAGE_BASE_URI}:${IMAGE_VERSION}"
          IMAGE_URI_RELEASE="${IMAGE_BASE_URI}:${IMAGE_ENVIRONMENT}-${IMAGE_VERSION}"

          docker build \
            -t "${IMAGE_URI_ENVIRONMENT}" \
            -t "${IMAGE_URI_VERSION}" \
            -t "${IMAGE_URI_RELEASE}" \
            .

          {
            echo "IMAGE_URI=${IMAGE_URI_RELEASE}"
            echo "IMAGE_URI_ENVIRONMENT=${IMAGE_URI_ENVIRONMENT}"
            echo "IMAGE_URI_VERSION=${IMAGE_URI_VERSION}"
            echo "IMAGE_URI_RELEASE=${IMAGE_URI_RELEASE}"
          } >> "$GITHUB_ENV"

      - name: Push image
        run: |
          docker push "${IMAGE_URI_ENVIRONMENT}"
          docker push "${IMAGE_URI_VERSION}"
          docker push "${IMAGE_URI_RELEASE}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          region: ${{ env.REGION }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=${{ env.CLOUD_SQL_INSTANCE }}
          env_vars: |
            NODE_ENV=production
            CORS_ORIGIN=${{ env.FRONTEND_URL }}
            APP_BASE_URL=${{ env.FRONTEND_URL }}
            DB_HOST=/cloudsql/${{ env.CLOUD_SQL_INSTANCE }}
            DB_PORT=5432
            DB_NAME=${{ env.DB_NAME }}
            DB_USER=${{ env.DB_USER }}
            DB_SSL=false
            DB_LOGGING=false
            DB_SYNC=false
            JWT_EXPIRES_IN=4h
            SESSION_COOKIE_NAME=carga_lms_session
            SESSION_COOKIE_SECURE=true
            SESSION_COOKIE_SAME_SITE=none
            GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
            GOOGLE_ALLOWED_DOMAIN=${{ env.GOOGLE_ALLOWED_DOMAIN }}
            LMS_NOTIFICATION_EMAIL=${{ env.LMS_NOTIFICATION_EMAIL }}
            SMTP_HOST=${{ env.SMTP_HOST }}
            SMTP_PORT=587
            SMTP_SECURE=false
            SMTP_FROM=${{ env.SMTP_FROM }}
          secrets: |
            DB_PASSWORD=${{ secrets.DB_PASSWORD_SECRET_NAME }}:latest
            JWT_SECRET=${{ secrets.JWT_SECRET_SECRET_NAME }}:latest
            SMTP_USER=${{ secrets.SMTP_USER_SECRET_NAME }}:latest
            SMTP_PASS=${{ secrets.SMTP_PASS_SECRET_NAME }}:latest

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --format "value(status.url)"

      - name: Show Cloud Run logs on failure
        if: failure()
        run: |
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --limit 50 \
            --format "value(timestamp,severity,textPayload)"
