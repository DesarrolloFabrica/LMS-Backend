services:
  postgres:
    image: postgres:16-alpine
    container_name: carga-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: control_lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - carga_lms_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_lms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  carga_lms_pgdata:
